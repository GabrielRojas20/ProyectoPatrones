name: Odoo adapter quality

on:
  pull_request:
    paths:
      - "infra/odoo/**"
      - "docs/decisions/**"
      - "tests/**"
      - "backend/src/ProyectoPatrones.Infrastructure.Odoo/**"
      - "backend/src/ProyectoPatrones.Infrastructure/**"
      - "backend/src/ProyectoPatrones.Application/**"
      - "backend/src/ProyectoPatrones.Api/**"
      - "tests/ProyectoPatrones.Odoo.ContractChecks/**"
      - ".github/workflows/odoo-quality.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "infra/odoo/**"
      - "docs/decisions/**"
      - "tests/**"
      - "backend/src/ProyectoPatrones.Infrastructure.Odoo/**"
      - "backend/src/ProyectoPatrones.Infrastructure/**"
      - "backend/src/ProyectoPatrones.Application/**"
      - "backend/src/ProyectoPatrones.Api/**"
      - "tests/ProyectoPatrones.Odoo.ContractChecks/**"
      - ".github/workflows/odoo-quality.yml"

permissions:
  contents: read

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Docker Compose
        run: docker compose --env-file .env.example -f infra/odoo/docker-compose.yml config --quiet
      - name: Validar sintaxis PowerShell
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem infra/odoo -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | Format-List; throw "Sintaxis PowerShell invalida en $($_.FullName)" }
          }
      - name: Validar sintaxis Python
        run: python -m compileall -q infra/odoo/scripts
      - name: Validar evidencias JSON
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          files = sorted(Path("infra/odoo/evidence").glob("*.json"))
          if not files:
              raise SystemExit("No existe evidencia JSON")

          def reject_secrets(value, path):
              forbidden_names = ("password", "api_key", "token", "authorization", "cookie")
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = str(key).casefold().replace("-", "_")
                      if any(name in normalized for name in forbidden_names):
                          raise SystemExit(f"{path}: campo sensible detectado: {key}")
                      reject_secrets(child, path)
              elif isinstance(value, list):
                  for child in value:
                      reject_secrets(child, path)
              elif isinstance(value, str):
                  if re.search(r"(?i)\bbearer\s+\S+", value) or re.search(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b", value):
                      raise SystemExit(f"{path}: posible token en valor de texto")

          for path in files:
              data = json.loads(path.read_text(encoding="utf-8-sig"))
              if not isinstance(data, dict):
                  raise SystemExit(f"{path}: la raíz debe ser un objeto JSON")

              if path.name == "infrastructure-sale-latest.json":
                  required = {"test", "result", "line_count", "state"}
                  missing = required - data.keys()
                  if missing:
                      raise SystemExit(f"{path}: faltan campos de evidencia de infraestructura {sorted(missing)}")
                  if data["test"] != "ODOO_INFRASTRUCTURE_SALE" or data["result"] != "PASS" or data["line_count"] != 2 or data["state"] != "paid":
                      raise SystemExit(f"{path}: evidencia de infraestructura no aprobada")
              elif path.name == "p09-api-latest.json":
                  required = {"schema_version", "result", "flow", "request", "verification"}
                  missing = required - data.keys()
                  if missing:
                      raise SystemExit(f"{path}: faltan campos de evidencia P09 {sorted(missing)}")
                  request = data["request"]
                  verification = data["verification"]
                  if not isinstance(request, dict) or not isinstance(verification, dict):
                      raise SystemExit(f"{path}: request y verification deben ser objetos")
                  confirmed_states = {"confirmed", "1"}
                  checks = (
                      data["schema_version"] == 1,
                      data["result"] == "PASS",
                      data["flow"] == "ASP.NET Core API -> OdooGateway -> Odoo JSON-2",
                      request.get("method") == "POST",
                      request.get("path") == "/api/sales",
                      request.get("http_status") == 200,
                      verification.get("method") == "GET",
                      str(verification.get("path", "")).startswith("/api/sales/"),
                      verification.get("http_status") == 200,
                      str(verification.get("sale_status", "")).casefold() in confirmed_states,
                      verification.get("line_count") == 2,
                      len(verification.get("product_ids", [])) == 2,
                      len(set(verification.get("product_ids", []))) == 2,
                      verification.get("payment_method") == "Efectivo Proyecto",
                      isinstance(verification.get("payment_method_id"), int) and verification["payment_method_id"] > 0,
                      isinstance(verification.get("odoo_order_id"), str) and bool(verification["odoo_order_id"]),
                  )
                  if not all(checks):
                      raise SystemExit(f"{path}: evidencia P09 no confirma dos productos, orden pagada y efectivo")
              else:
                  raise SystemExit(f"{path}: tipo de evidencia JSON no reconocido")

              reject_secrets(data, path)
          PY

  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compilar infraestructura Odoo actual
        run: dotnet build backend/src/ProyectoPatrones.Infrastructure/ProyectoPatrones.Infrastructure.csproj --configuration Release
      - name: Ejecutar verificaciones de contrato
        run: dotnet run --project tests/ProyectoPatrones.Odoo.ContractChecks/ProyectoPatrones.Odoo.ContractChecks.csproj --configuration Release
      - name: Ejecutar pruebas del backend
        run: dotnet test backend/ProyectoPatrones.Backend.slnx --configuration Release
