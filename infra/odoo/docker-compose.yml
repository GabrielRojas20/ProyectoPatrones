services:
  postgres:
    image: postgres:16
    container_name: proyectopatrones-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD:?Define ODOO_POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  odoo:
    image: odoo:20.0
    container_name: proyectopatrones-odoo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${ODOO_POSTGRES_PASSWORD:?Define ODOO_POSTGRES_PASSWORD en .env}
    volumes:
      - odoo_data:/var/lib/odoo
    restart: unless-stopped
volumes:
  postgres_data:
  odoo_data:
