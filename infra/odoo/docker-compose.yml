services:
  postgres:
    image: postgres:16
    container_name: proyectopatrones-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD:?Define ODOO_POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  odoo:
    image: odoo:20.0
    container_name: proyectopatrones-odoo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${ODOO_POSTGRES_PASSWORD:?Define ODOO_POSTGRES_PASSWORD en .env}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./scripts:/mnt/odoo-scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  postgres_data:
  odoo_data:
